services:
  db:
    image: postgres:17.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-website}
      POSTGRES_USER: ${POSTGRES_USER:-website}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - database

  backend:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    command:
      - sh
      - -c
      - >-
        python manage.py migrate --noinput
        && python manage.py collectstatic --noinput
        && exec gunicorn --bind=0.0.0.0:8000 --workers=2 --access-logfile=-
        --error-logfile=- config.wsgi:application
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in backend/.env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DJANGO_STATIC_ROOT: /data/static
      DJANGO_MEDIA_ROOT: /data/media
      DJANGO_MEDIA_URL: /media/
      DJANGO_UPLOAD_MAX_BYTES: ${DJANGO_UPLOAD_MAX_BYTES:-10485760}
      POSTGRES_DB: ${POSTGRES_DB:-website}
      POSTGRES_USER: ${POSTGRES_USER:-website}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/data/media
      - static_data:/data/static
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          from urllib.request import urlopen; response = urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=2); exit(0 if response.status == 200 else 1)
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks:
      - frontend
      - database

  frontend:
    build:
      context: ./frontend
      target: production
    restart: unless-stopped
    environment:
      BACKEND_API_URL: http://backend:8000
      PUBLIC_SITE_ORIGIN: ${PUBLIC_SITE_ORIGIN:-http://localhost:3000}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend

  proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      UPLOAD_REQUEST_MAX_SIZE: ${UPLOAD_REQUEST_MAX_SIZE:-11MiB}
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      demo:
        condition: service_started
    ports:
      - "127.0.0.1:${PROXY_PORT:-3000}:80"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - media_data:/srv/media:ro
      - static_data:/srv/static:ro
    networks:
      - frontend
      - demo_proxy

  demo:
    image: nginx:1.29.4-alpine
    restart: unless-stopped
    volumes:
      - ./demo:/usr/share/nginx/html:ro
    networks:
      - demo_proxy

volumes:
  postgres_data:
  media_data:
  static_data:

networks:
  frontend:
  demo_proxy:
  database:
    internal: true
