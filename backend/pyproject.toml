[project]
name = "personal-website-backend"
version = "0.1.0"
description = "Django content backend for the personal website"
requires-python = ">=3.14,<3.15"
dependencies = [
    "Django==5.2.18",
    "psycopg[binary]==3.3.6",
]

[dependency-groups]
dev = [
    "ruff==0.17.3",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
