name: Build and publish production containers

on:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  backend:
    uses: ./.github/workflows/backend.yml
  frontend:
    uses: ./.github/workflows/frontend.yml
  containers:
    uses: ./.github/workflows/container-integration.yml

  publish:
    if: github.ref == 'refs/heads/main'
    needs: [backend, frontend, containers]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select image names
        id: names
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "prefix=ghcr.io/${OWNER,,}/personal-website" >> "$GITHUB_OUTPUT"
      - name: Publish Django image
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.names.outputs.prefix }}-backend:prod
            ${{ steps.names.outputs.prefix }}-backend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Publish React image
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.names.outputs.prefix }}-frontend:prod
            ${{ steps.names.outputs.prefix }}-frontend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

