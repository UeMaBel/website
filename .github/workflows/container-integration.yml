name: Container integration

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: container-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrated-stack:
    name: Build and smoke-test local Compose stack
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate and smoke-test containers
        run: bash .github/scripts/compose-smoke.sh
        env:
          CI_COMPOSE_LOG: ${{ runner.temp }}/website-compose-ci.log

      - name: Retain Compose logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: container-integration-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/website-compose-ci.log
          if-no-files-found: warn
          retention-days: 7
